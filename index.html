<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastille</title>
<link rel="stylesheet" href="/src/styles.css">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<!-- 1440 × 900 stage (the mockup), scaled to the screen and resting on its bottom edge -->
<div class="scene">
<div class="stage" id="stage" hidden>
  <span class="wallpaper-hint" aria-hidden="true" data-en="[ YOUR WALLPAPER ]">[ TON FOND D'ÉCRAN ]</span>

  <div class="phone tp-rise" id="phone">
  <div class="phone-tilt">
  <div class="phone-orient">

    <!-- Right side edge of the phone, visible when it is tilted -->
    <div class="edges" aria-hidden="true">
      <div class="edge edge-arc" style="left: 374.9px; top: 11.9px; --rz: 35deg"></div>
      <div class="edge edge-arc" style="left: 383.7px; top: 19.3px; --rz: 45deg"></div>
      <div class="edge edge-arc" style="left: 391.1px; top: 28.1px; --rz: 55deg"></div>
      <div class="edge edge-arc" style="left: 396.8px; top: 38.1px; --rz: 65deg"></div>
      <div class="edge edge-arc" style="left: 400.8px; top: 48.9px; --rz: 75deg"></div>
      <div class="edge edge-arc" style="left: 402.7px; top: 60.2px; --rz: 85deg"></div>
      <div class="edge edge-arc" style="left: 402.7px; top: 769.8px; --rz: 95deg"></div>
      <div class="edge edge-arc" style="left: 400.8px; top: 781.1px; --rz: 105deg"></div>
      <div class="edge edge-arc" style="left: 396.8px; top: 791.9px; --rz: 115deg"></div>
      <div class="edge edge-arc" style="left: 391.1px; top: 801.9px; --rz: 125deg"></div>
      <div class="edge edge-arc" style="left: 383.7px; top: 810.7px; --rz: 135deg"></div>
      <div class="edge edge-side">
        <div class="side-btn" style="top: 100px; height: 70px"></div>
        <div class="side-btn" style="top: 182px; height: 70px"></div>
        <div class="side-btn pink" style="top: 308px; height: 104px"></div>
        <div class="side-slot"></div>
      </div>
    </div>

    <!-- Strap (requested by Funsaiki, not in the mockup): ring in the left edge, cord,
         three pastel beads and a charm (the Pastille charm by default; chosen in the Appearance
         card of the Settings page, set by customize.ts). The attachment point is the center
         of the ring. A click opens the Settings page, on the Strap tab. -->
    <div class="strap" id="strap" aria-hidden="true" title="Personnaliser le strap" data-en-title="Customize the strap">
      <div class="strap-swing" id="strap-swing">
        <svg width="62" height="186" viewBox="0 0 44 132" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12.5V27M22 71V97" stroke-width="2.5"/>
          <circle cx="22" cy="7" r="5.5" stroke-width="3"/>
          <circle cx="22" cy="36" r="7" fill="currentColor" stroke="none"/>
          <circle cx="22" cy="34" r="7" style="fill: var(--bead-1)" stroke-width="2.5"/>
          <circle cx="19.5" cy="31.5" r="1.8" fill="#ffffff" stroke="none"/>
          <circle cx="22" cy="51" r="7" fill="currentColor" stroke="none"/>
          <circle cx="22" cy="49" r="7" style="fill: var(--bead-2)" stroke-width="2.5"/>
          <circle cx="19.5" cy="46.5" r="1.8" fill="#ffffff" stroke="none"/>
          <circle cx="22" cy="66" r="7" fill="currentColor" stroke="none"/>
          <circle cx="22" cy="64" r="7" style="fill: var(--bead-3)" stroke-width="2.5"/>
          <circle cx="19.5" cy="61.5" r="1.8" fill="#ffffff" stroke="none"/>
        </svg>
        <div class="strap-charm" id="strap-charm"></div>
      </div>
    </div>

    <div class="phone-body">
    <div class="screen">
      <div class="island" id="island">
        <!-- Update available (asked for by Funsaiki, not in the mockup): the island grows and says so -->
        <button class="island-update" id="island-update" tabindex="-1"><span class="island-label" data-en="Get update">Mise à jour</span></button>
        <span class="island-lens" aria-hidden="true"></span>
      </div>

      <!-- Quick settings view, phone upright -->
      <div class="view-settings" id="settings">
        <div class="status">
          <div class="status-time">
            <span class="time clock">--:--</span>
            <span class="date" id="date"></span>
          </div>
          <div class="status-right">
            <!-- Wi-Fi and Bluetooth (requested by Funsaiki, not in the mockup): added by ui.ts -->
            <div class="status-links" id="links"></div>
            <div class="status-net" title="Débit réseau" data-en-title="Network speed">
              <span id="net-down">↓ –</span>
              <span class="soft" id="net-up">↑ –</span>
            </div>
          </div>
        </div>

        <div class="user">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div class="user-text">
            <span class="user-name" id="user-name"></span>
            <span class="user-os" id="user-os"></span>
          </div>
          <!-- Pastille settings, Windows settings and Power (the mockup's row of buttons
               is removed, Funsaiki's request) -->
          <div class="user-actions" id="actions"></div>
        </div>

        <!-- Toggles (added by ui.ts before the Apps button) -->
        <div class="tiles" id="tiles">
          <button class="tp-press tp-pop qtile qtile-apps" id="open-apps">
            <span class="qtile-dot">
              <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg>
            </span>
            <span class="qtile-text">
              <span class="qtile-label" data-en="Apps">Applications</span>
              <span class="qtile-sub" id="app-count"></span>
            </span>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>

        <div class="card sliders">
          <div class="slider">
            <span class="slider-head">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path id="volume-icon"></path></svg>
              <span>Volume</span>
              <span class="slider-value" id="volume-text"></span>
              <!-- Mixer (requested by Funsaiki, not in the mockup) -->
              <button class="tp-press mixer-toggle" id="mixer-toggle" aria-label="Mélangeur" title="Mélangeur" data-en-label="Mixer" data-en-title="Mixer" aria-expanded="false" aria-controls="mixer">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h9M17 6h3M15 4v4M4 12h3M11 12h9M9 10v4M4 18h11M19 18h1M17 16v4"></path></svg>
              </button>
            </span>
            <input class="tp-range" id="volume" type="range" min="0" max="100" aria-label="Volume">
          </div>
          <div class="mixer" id="mixer" role="group" aria-label="Mélangeur" data-en-label="Mixer">
            <div class="mixer-channels" id="mixer-channels"></div>
          </div>
        </div>

        <div class="card media">
          <div class="media-art" id="media-art" aria-hidden="true">
            <span class="tp-eq" id="eq"><i></i><i></i><i></i></span>
          </div>
          <div class="media-text">
            <span class="media-title" id="media-title"></span>
            <span class="media-artist" id="media-artist"></span>
            <!-- Spotify volume (requested by Funsaiki): Spotify's own once connected
                 (Settings page), otherwise the one in the Windows mixer -->
            <div class="media-controls">
              <!-- Ten equalizer steps (Funsaiki found a small slider redundant with the
                   volume): click or drag, 10% per step; wheel on the card, arrow keys -->
              <div class="media-volume" id="media-volume" role="slider" tabindex="0" aria-label="Volume de Spotify" data-en-label="Spotify volume" aria-valuemin="0" aria-valuemax="100">
                <i style="--h: 5px"></i><i style="--h: 6px"></i><i style="--h: 7px"></i><i style="--h: 8px"></i><i style="--h: 9px"></i><i style="--h: 10px"></i><i style="--h: 11px"></i><i style="--h: 12px"></i><i style="--h: 13px"></i><i style="--h: 14px"></i>
              </div>
              <!-- Shuffle and repeat (requested by Funsaiki), Spotify connected only -->
              <button class="media-mode" id="shuffle" aria-label="Lecture aléatoire" title="Lecture aléatoire" data-en-label="Shuffle" data-en-title="Shuffle" aria-pressed="false" hidden>
                <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path><path class="smart-spark" d="M4.5 10v7M1 13.5h7"></path></svg>
              </button>
              <button class="media-mode" id="repeat" aria-label="Répétition" title="Répétition" data-en-label="Repeat" data-en-title="Repeat" aria-pressed="false" hidden>
                <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"></path><path class="repeat-one" d="M11 10.5l1.5-1.5v6"></path></svg>
              </button>
            </div>
          </div>
          <button class="tp-press media-btn" id="previous" aria-label="Précédent" data-en-label="Previous">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M18 5v14L8 12zM6 5v14"></path></svg>
          </button>
          <button class="tp-press media-btn media-play" id="play">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="icon-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="icon-play"><path d="M8 5l11 7-11 7z"></path></svg>
          </button>
          <button class="tp-press media-btn" id="next" aria-label="Suivant" data-en-label="Next">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 5v14l10-7zM18 5v14"></path></svg>
          </button>
        </div>

        <!-- Bottom card: two tabs (requested by Funsaiki), the notification area apps
             and the mockup's notifications -->
        <div class="notifs">
          <div class="notifs-title notifs-tabs" id="tabs" role="tablist" data-pane="apps">
            <span class="tabs-thumb" aria-hidden="true"></span>
            <button class="notifs-tab" id="tab-apps" role="tab" aria-selected="true" aria-controls="tray-pane">
              Apps <span class="notifs-count" id="tray-count"></span>
            </button>
            <button class="notifs-tab" id="tab-notifs" role="tab" aria-selected="false" aria-controls="notifs-pane">
              Notifs <span class="notifs-count" id="notif-count"></span>
            </button>
          </div>

          <!-- Notification area apps: click to open, right-click for the menu -->
          <div class="notifs-pane" id="tray-pane" role="tabpanel" aria-labelledby="tab-apps">
            <div class="tray-grid" id="tray-grid"></div>
            <div class="notifs-empty" id="tray-empty" hidden>
              <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg>
              <span class="notifs-empty-text" data-en="No apps in the background">Aucune app en arrière-plan</span>
            </div>
          </div>

          <!-- Outside the tab's content: it does not slide with it (shown with Notifs, ui.ts) -->
          <button class="tp-link notifs-clear" id="notif-clear" data-en="Clear all" hidden>Tout effacer</button>
          <div class="notifs-pane" id="notifs-pane" role="tabpanel" aria-labelledby="tab-notifs" hidden>
            <div class="notifs-list" id="notif-list"></div>
            <div class="notifs-empty" id="notif-empty">
              <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg>
              <span class="notifs-empty-text" data-en="Nothing new">Rien de neuf</span>
              <button class="tp-link notifs-restore" id="notif-restore" data-en="Show all again">Tout réafficher</button>
            </div>
          </div>

          <!-- Right-click menu on an app (the icons' real menus are out of
               reach, see tray_apps.rs) -->
          <div class="tray-menu" id="tray-menu" role="menu" aria-labelledby="tray-menu-name">
            <span class="tray-menu-name" id="tray-menu-name"></span>
            <div class="tray-menu-items" id="tray-menu-items"></div>
          </div>
        </div>

        <!-- Settings page (requested by Funsaiki on 2026-10-21, not in the mockup):
             slides in place of the rest of the view, below the status bar. Rows added by
             prefs.ts; the Appearance section is the former Customize card (customize.ts). -->
        <div class="prefs" id="prefs" role="region" aria-labelledby="prefs-title">
          <div class="prefs-head">
            <button class="tp-press back" id="prefs-back" aria-label="Retour" data-en-label="Back">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <div class="apps-title">
              <span class="apps-sup">Pastille</span>
              <span class="apps-name" id="prefs-title" data-en="Settings">Paramètres</span>
            </div>
          </div>
          <div class="prefs-body" id="prefs-body">
            <!-- Failed action: at the top of the page (the notifications are behind it) -->
            <div class="notif prefs-problem" id="prefs-problem" role="alert" hidden>
              <span class="notif-icon" id="prefs-problem-icon" style="background: #ffe08a" aria-hidden="true"></span>
              <span class="notif-text">
                <span class="notif-title" id="prefs-problem-title"></span>
                <span class="notif-body" id="prefs-problem-text"></span>
              </span>
            </div>
            <section class="prefs-section" aria-labelledby="prefs-general-title">
              <h2 class="prefs-title" id="prefs-general-title" data-en="General">Général</h2>
              <div class="prefs-list" id="prefs-general"></div>
            </section>
            <section class="prefs-section" id="prefs-look" aria-labelledby="prefs-look-title">
              <h2 class="prefs-title" id="prefs-look-title" data-en="Appearance">Apparence</h2>
              <div class="card custom">
                <div class="custom-head">
                  <div class="notifs-tabs custom-tabs" id="custom-tabs" role="tablist" data-pane="colors">
                    <span class="tabs-thumb" aria-hidden="true"></span>
                    <button class="notifs-tab" id="custom-tab-colors" role="tab" aria-selected="true" aria-controls="custom-colors" data-en="Colors">Couleurs</button>
                    <button class="notifs-tab" id="custom-tab-strap" role="tab" aria-selected="false" aria-controls="custom-strap" tabindex="-1">Strap</button>
                    <button class="notifs-tab" id="custom-tab-phone" role="tab" aria-selected="false" aria-controls="custom-phone" tabindex="-1" data-en="Phone">Téléphone</button>
                  </div>
                  <button class="tp-link custom-reset" id="custom-reset" data-en="Reset">Réinitialiser</button>
                </div>
                <div class="custom-pane" id="custom-colors" role="tabpanel" aria-labelledby="custom-tab-colors"></div>
                <div class="custom-pane" id="custom-strap" role="tabpanel" aria-labelledby="custom-tab-strap" hidden></div>
                <div class="custom-pane" id="custom-phone" role="tabpanel" aria-labelledby="custom-tab-phone" hidden></div>
              </div>
            </section>
            <section class="prefs-section" aria-labelledby="prefs-spotify-title">
              <h2 class="prefs-title" id="prefs-spotify-title">Spotify</h2>
              <div class="prefs-list" id="prefs-spotify"></div>
            </section>
            <section class="prefs-section" aria-labelledby="prefs-apps-title">
              <h2 class="prefs-title" id="prefs-apps-title" data-en="Apps">Applications</h2>
              <div class="prefs-list" id="prefs-apps"></div>
            </section>
            <section class="prefs-section" aria-labelledby="prefs-about-title">
              <h2 class="prefs-title" id="prefs-about-title">Pastille</h2>
              <div class="prefs-list" id="prefs-about"></div>
            </section>
          </div>
        </div>

        <!-- What's new (requested by Funsaiki on 2026-10-24, not in the mockup): a page like
             the Settings page, opened by its notification after an update or from Settings
             (Pastille section). Sections added by news.ts. -->
        <div class="prefs" id="news" role="region" aria-labelledby="news-title">
          <div class="prefs-head">
            <button class="tp-press back" id="news-back" aria-label="Retour" data-en-label="Back">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <div class="apps-title">
              <span class="apps-sup">Pastille</span>
              <span class="apps-name" id="news-title" data-en="What’s new">Nouveautés</span>
            </div>
          </div>
          <div class="prefs-body" id="news-body"></div>
        </div>
      </div>

      <!-- Apps view, phone laid flat -->
      <div class="view-apps" id="apps" hidden>
        <div class="apps-head">
          <button class="tp-press back" id="back" aria-label="Retour" data-en-label="Back">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
          </button>
          <div class="apps-title">
            <span class="apps-sup" id="head-sup"></span>
            <span class="apps-name" id="head-title"></span>
          </div>
          <label class="tp-search search">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4"></path></svg>
            <span class="sr-only" data-en="Search for an app">Rechercher une application</span>
            <input type="text" id="q" placeholder="Rechercher une app…" data-en-placeholder="Search for an app…" autocomplete="off" spellcheck="false">
          </label>
          <span class="apps-count" id="item-count"></span>
          <span class="apps-time clock">--:--</span>
        </div>

        <div class="grid" id="grid"></div>
        <!-- Nothing found: web search offered (Funsaiki's request), Enter runs it -->
        <div class="no-result" id="no-result" hidden>
          <span data-en="No app found">Aucune app trouvée</span>
          <button class="tp-press folder web-search" id="web-search"></button>
        </div>

        <!-- Recent (requested by Funsaiki, not in the mockup): last launched apps -->
        <div class="recents" id="recents" hidden>
          <span class="folders-title" data-en="Recent">Récents</span>
          <div class="folders-row" id="recent-row"></div>
        </div>

        <div class="folders" id="folders">
          <span class="folders-title" data-en="Folders">Dossiers</span>
          <div class="folders-row" id="folder-row"></div>
        </div>

        <!-- Right-click menu on an app (requested by Funsaiki): the Apps tab one,
             next to the tile -->
        <div class="tray-menu app-menu" id="app-menu" role="menu" aria-labelledby="app-menu-name">
          <span class="tray-menu-name" id="app-menu-name"></span>
          <div class="tray-menu-items" id="app-menu-items"></div>
        </div>
      </div>

      <!-- Power menu (requested by Funsaiki, not in the mockup): darkens the screen,
           choosing an action serves as confirmation -->
      <div class="power" id="power" role="dialog" aria-modal="true" aria-label="Alimentation" data-en-label="Power">
        <div class="power-menu">
          <div class="power-choices" id="power-choices"></div>
          <p class="power-error" id="power-error" hidden></p>
          <button class="power-cancel" id="power-cancel" data-en="Cancel">Annuler</button>
        </div>
      </div>
    </div>
    </div>

  </div>
  </div>
  </div>
</div>
</div>
</body>
</html>
