# Installateur de Pastille sur les releases GitHub (demandé par Funsaiki le 17/10/2026).
# Tag « vX.Y.Z » poussé (la version de tauri.conf.json) : compilation sur Windows, puis release
# publiée avec l'installateur, sa signature et latest.json, que les Pastille installées
# consultent pour se mettre à jour (update.rs). Lancé à la main (onglet Actions, « Run
# workflow ») : compilation seulement, l'installateur dans les artefacts de l'exécution, rien
# n'est publié.
name: Installateur

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag et version identiques
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Le tag ${{ github.ref_name }} ne correspond pas à la version $version de tauri.conf.json."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Sans tag (lancement à la main) : tagName vide, compilation seulement
      # Clé de signature des mises à jour (clé privée de Funsaiki, sans mot de passe)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Pastille __VERSION__
          releaseBody: |
            Installateur Windows ci-dessous (sans droits administrateur).
            Il n'est pas signé : Windows affiche « Windows a protégé votre ordinateur » ; cliquer sur « Informations complémentaires », puis « Exécuter quand même ».
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: installateur
          path: src-tauri/target/release/bundle/nsis/*.exe
