# Tests: on every push to main, on every pull request, and before every release (called by
# release.yml). Front end: types and build (`npm run build`); Rust: `cargo test`, on Windows.
# Diagnostics marked #[ignore] read the maintainer's own PC: they don't run here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache shared with the release check (same build profile)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tests

      - run: npm ci

      - run: npm run build

      - run: cargo test
        working-directory: src-tauri
