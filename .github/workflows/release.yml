# Pastille installer on GitHub releases.
# A pushed "vX.Y.Z" tag (the version in tauri.conf.json): tests, Windows build, then a release
# published with the installer, its signature and latest.json, which installed copies read to
# update themselves (update.rs), and finally a check of the published release.
# Run by hand (Actions tab, "Run workflow"): tests and build only, the installer in the run's
# artifacts, nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is published if a test fails
  tests:
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match version $version in tauri.conf.json."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Without a tag (run by hand): empty tagName, build only. Update signing key: the
      # maintainer's private key, without a password.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Pastille __VERSION__
          releaseBody: |
            Windows installer below (no administrator rights needed).
            It is not signed, so Windows shows "Windows protected your PC": click "More info", then "Run anyway".
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Published release: do installed copies find it (latest.json), and does the downloaded
  # installer have a valid signature for the public key in tauri.conf.json? Nothing is
  # installed (tests/update_check.rs).
  verification:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tests

      - run: npm ci

      - run: npm run build

      - run: cargo test --test update_check -- --ignored --nocapture
        working-directory: src-tauri
